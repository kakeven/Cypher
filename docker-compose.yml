services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - sqlite-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - CYPHER_DATABASE_URL=sqlite:////app/data/cypher.db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend

  cypher-android:
    build: ./mobile/cypher-android
    ports:
      - "5174:5173"
    volumes:
      - ./mobile/cypher-android:/app
      - cypher-android-node-modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  sqlite-data:
  frontend-node-modules:
  cypher-android-node-modules:
